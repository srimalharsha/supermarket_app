# Auto-deploy web + Android APK for SriHarsha Digital

name: Deploy Web + Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix Admin notification state before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          marker = 'class _AdminPanelState extends State<AdminPanel> {\\n'
          if marker in s and 'class _AdminPanelState extends State<AdminPanel> {\\n  int _adminTab = 0;' not in s:
              s = s.replace(marker, marker + '  int _adminTab = 0;\\n', 1)
          p.write_text(s)
          PY

      - name: Build Web
        run: flutter build web

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERMARKET_APP_51515 }}
          channelId: live
          projectId: supermarket-app-51515

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
